name: "RIM iOS TestFlight (uye App Store, yonetim sadece dahili)"
on:
  workflow_dispatch:
    inputs:
      surum: { description: 'versionName', required: true, default: '1.0.0' }
      hedef: { description: 'uye | admin', required: true, default: 'uye' }
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ibrahim0571/rim-app
          token: ${{ secrets.RIM_REPO_TOKEN }}
      - name: Xcode (en yeni)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"; xcodebuild -version
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-audit --no-fund
      - run: bash scripts/ios_hazirla.sh ${{ github.event.inputs.surum }} ${{ github.run_number }} ${{ github.event.inputs.hedef }}
      - name: CocoaPods
        working-directory: ios/App
        run: pod install
      - name: Sertifika + profil
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          P12_PW: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE: ${{ github.event.inputs.hedef == 'admin' && secrets.RIMADMIN_IOS_PROVISION_BASE64 || secrets.RIM_IOS_PROVISION_BASE64 }}
        run: |
          set -e
          echo "$P12" | base64 -d > /tmp/c.p12; echo "$PROFILE" | base64 -d > /tmp/pp.mobileprovision
          security create-keychain -p ci b.keychain; security default-keychain -s b.keychain; security unlock-keychain -p ci b.keychain
          security set-keychain-settings -t 3600 -u b.keychain
          security import /tmp/c.p12 -k b.keychain -P "$P12_PW" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci b.keychain
          D="$HOME/Library/MobileDevice/Provisioning Profiles"; mkdir -p "$D"
          U=$(security cms -D -i /tmp/pp.mobileprovision | plutil -extract UUID raw -); cp /tmp/pp.mobileprovision "$D/$U.mobileprovision"
      - name: Arsiv + IPA
        working-directory: ios/App
        env:
          TEAM_ID: ZU23KJAUGH
          BID: ${{ github.event.inputs.hedef == 'admin' && 'com.ibrahimaktas.rimadmin' || 'com.ibrahimaktas.rim' }}
        run: |
          set -e
          PA=$(security cms -D -i /tmp/pp.mobileprovision | plutil -extract Name raw -)
          sed -i '' "s|PRODUCT_BUNDLE_IDENTIFIER = $BID;|PRODUCT_BUNDLE_IDENTIFIER = $BID; CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = $TEAM_ID; PROVISIONING_PROFILE_SPECIFIER = \"$PA\"; CODE_SIGN_IDENTITY = \"iPhone Distribution\";|g" App.xcodeproj/project.pbxproj
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath build/App.xcarchive DEVELOPMENT_TEAM=$TEAM_ID archive | tail -30
          cat > /tmp/EO.plist <<EOP
          <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>teamID</key><string>$TEAM_ID</string>
          <key>signingStyle</key><string>manual</string><key>signingCertificate</key><string>iPhone Distribution</string>
          <key>provisioningProfiles</key><dict><key>$BID</key><string>$PA</string></dict></dict></plist>
          EOP
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist /tmp/EO.plist -exportPath build/ipa
      - name: TestFlight
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys; echo "$KEY" > ~/private_keys/AuthKey_$KEY_ID.p8
          IPA=$(ls ios/App/build/ipa/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
      - uses: actions/upload-artifact@v4
        with:
          name: rim-ios-${{ github.event.inputs.hedef }}
          path: ios/App/build/ipa/*.ipa
          retention-days: 30
