name: Ravza Native App Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  # ─── ANDROID APK/AAB ───────────────────────────────────
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install deps
        run: npm install
      - name: Add Android platform
        run: |
          npx cap add android || true
          npx cap sync android
      - name: Build APK (debug)
        run: |
          cd android
          ./gradlew assembleDebug
      - name: Build AAB (release, imzalı — keystore secret gerekli)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/ravza.keystore
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=ravza.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ravza-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab

  # ─── iOS IPA (Mac runner — Apple Developer hesabı gerekli) ──
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm install
      - name: Add iOS platform
        run: |
          npx cap add ios || true
          npx cap sync ios
      - name: Build iOS (imzasız — App Store için Apple hesabı + fastlane gerekli)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -archivePath build/Ravza.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO || echo "iOS imzasız derleme (App Store için Apple Dev hesabı + fastlane ekle)"
