name: Ravza Native App Build

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release build (imzalı AAB)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  # ─── ANDROID APK (debug) + AAB (release, imzalı) ──────────
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install deps
        run: npm install

      - name: Add Android platform + sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Android izinleri + versionCode (BLE/bildirim/biyometrik)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # izinleri <manifest> acilisindan sonra ekle (yoksa)
          if ! grep -q "BLUETOOTH_SCAN" "$MANIFEST"; then
            perl -0pi -e 's/(<manifest[^>]*>)/$1\n    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"\/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"\/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"\/>\n    <uses-permission android:name="android.permission.VIBRATE"\/>\n    <uses-feature android:name="android.hardware.bluetooth_le" android:required="false"\/>/' "$MANIFEST"
            echo "izinler eklendi"
          fi
          # versionCode: GitHub run number ile benzersiz
          GRADLE=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" "$GRADLE" || true
          echo "versionCode=${{ github.run_number }}"
          grep -E "versionCode|versionName" "$GRADLE" | head -2 || true

      - name: Gradlew izin
        run: chmod +x android/gradlew || true

      - name: Build APK (debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Build AAB (release, imzalı)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/ravza.keystore
          cd android
          ./gradlew bundleRelease --stacktrace \
            -Pandroid.injected.signing.store.file=ravza.keystore \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Build APK (release, imzalı — direkt kurulum için)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file=ravza.keystore \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Upload Android çıktıları
        uses: actions/upload-artifact@v4
        with:
          name: ravza-android
          retention-days: 30
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

      - name: Build log (hata halinde)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: |
            android/app/build/reports/**
            android/build/**/*.txt

  # ─── iOS IPA (macOS runner — Apple Developer hesabı gerekli) ──
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm install

      - name: Add iOS platform + sync
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: iOS Info.plist izinleri (Bluetooth/FaceID/push açıklamaları)
        run: |
          PLIST=ios/App/App/Info.plist
          if [ -f "$PLIST" ] && ! grep -q "NSBluetoothAlwaysUsageDescription" "$PLIST"; then
            /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string 'Ravza zikir yüzüğünüzü bağlamak için Bluetooth kullanır.'" "$PLIST" || true
            /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string 'Ravza zikir cihazınızla bağlantı için Bluetooth kullanır.'" "$PLIST" || true
            /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Ravza güvenli girişte Face ID kullanır.'" "$PLIST" || true
            echo "iOS izinleri eklendi"
          fi

      - name: CocoaPods
        run: |
          cd ios/App
          pod install || true

      - name: Build iOS (imzasız arşiv — App Store için Apple Dev + fastlane)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -archivePath build/Ravza.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO || echo "iOS imzasız derleme tamamlandı (App Store için Apple Dev hesabı + fastlane/ASC API key ekle)"

      - name: Upload iOS arşiv
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ravza-ios-archive
          retention-days: 30
          path: ios/App/build/Ravza.xcarchive

