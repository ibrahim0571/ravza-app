# Ravza — iOS derleme (Mac GEREKMEZ, GitHub'in macOS runner'i kullanilir)
# 2 mod:
#  A) imzasiz  -> her push'ta calisir, .app/.ipa uretir, TEST icin (Apple hesabi GEREKMEZ)
#  B) imzali   -> secrets varsa TestFlight'a yukler (Apple Developer 99$/yil GEREKIR)
name: iOS Build

on:
  workflow_dispatch:
    inputs:
      mod:
        description: 'imzasiz (test) veya imzali (TestFlight)'
        required: true
        default: 'imzasiz'
        type: choice
        options: [imzasiz, imzali]
  push:
    branches: [main]
    paths: ['ios/**', 'capacitor.config.json', 'package.json', '.github/workflows/ios.yml']

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode surumu sec (iOS 26 SDK zorunlu)
        run: |
          echo "--- Kurulu Xcode surumleri ---"
          ls /Applications | grep -i "^Xcode" || true
          # Apple: iOS 26 SDK ZORUNLU (17.5 ile yukleme REDDEDILIYOR)
          # En yuksek surumu sec
          EN_YENI=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Secilen: $EN_YENI"
          sudo xcode-select -s "$EN_YENI/Contents/Developer"
          xcodebuild -version
          echo "--- iOS SDK ---"
          xcodebuild -showsdks | grep -i ios

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bagimliliklar
        run: npm ci || npm install

      - name: www klasoru garanti
        run: |
          mkdir -p www
          [ -f www/index.html ] || echo '<!doctype html><meta http-equiv="refresh" content="0;url=https://tesbihat.ibrahimaktas.com">' > www/index.html

      - name: Capacitor sync
        run: npx cap sync ios

      - name: CocoaPods
        working-directory: ios/App
        run: |
          pod repo update --silent || true
          pod install

      # ---------- A) IMZASIZ (Apple hesabi gerekmez) ----------
      - name: Derle (imzasiz)
        if: github.event.inputs.mod != 'imzali'
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: IPA paketle (imzasiz)
        if: github.event.inputs.mod != 'imzali'
        working-directory: ios/App
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr Ravza-imzasiz.ipa Payload
          ls -la Ravza-imzasiz.ipa

      - name: Ciktiyi yukle
        if: github.event.inputs.mod != 'imzali'
        uses: actions/upload-artifact@v4
        with:
          name: ravza-ios-imzasiz
          path: ios/App/Ravza-imzasiz.ipa
          retention-days: 30

      # ---------- B) IMZALI (Apple Developer 99$ gerekir) ----------
      - name: Sertifika kur (imzali)
        if: github.event.inputs.mod == 'imzali'
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          P12_PW: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_BASE64 }}
        run: |
          set -e
          if [ -z "$P12" ]; then echo "::error::IOS_P12_BASE64 secret yok."; exit 1; fi
          if [ -z "$PROFILE" ]; then echo "::error::IOS_PROVISION_BASE64 secret yok."; exit 1; fi

          echo "$P12" | base64 -d > /tmp/cert.p12
          echo "$PROFILE" | base64 -d > /tmp/pp.mobileprovision
          echo "p12: $(wc -c < /tmp/cert.p12) byte, profil: $(wc -c < /tmp/pp.mobileprovision) byte"

          # Gecici anahtar zinciri olustur ve sertifikayi yukle
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$P12_PW" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain

          echo "--- Yuklu imzalama kimlikleri ---"
          security find-identity -v -p codesigning build.keychain

          # Saglama profilini DOGRU klasore koy (UUID adiyla)
          PROFIL_DIZIN="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFIL_DIZIN"
          UUID=$(security cms -D -i /tmp/pp.mobileprovision | plutil -extract UUID raw -)
          cp /tmp/pp.mobileprovision "$PROFIL_DIZIN/$UUID.mobileprovision"
          echo "Profil kuruldu: $UUID"
          ls -la "$PROFIL_DIZIN/"

      - name: Arsivle ve IPA uret (imzali)
        if: github.event.inputs.mod == 'imzali'
        working-directory: ios/App
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -e
          # Saglama profilinin adini oku (imzalama icin gerekli)
          PP=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -1)
          export PROFIL_ADI=$(security cms -D -i "$PP" | plutil -extract Name raw -)
          echo "Profil: $PROFIL_ADI"

          # KOK NEDEN NOTU: Profil komut satirindan verilirse Xcode onu TUM
          # hedeflere (Pods/eklenti kutuphaneleri dahil) uygular ve
          # "does not support provisioning profiles" hatasi verir.
          # Cozum: profili SADECE ana uygulamaya, proje dosyasi uzerinden ver.
          # KOK NEDEN: profil komut satirindan verilirse TUM hedeflere
          # (Pods dahil) uygulanir -> "does not support provisioning profiles".
          # Cozum: proje dosyasindaki App hedefine yaz, Pods'a dokunma.
          sed -i '' "s|PRODUCT_BUNDLE_IDENTIFIER = com.ibrahimaktas.ravza;|PRODUCT_BUNDLE_IDENTIFIER = com.ibrahimaktas.ravza; CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = $TEAM_ID; PROVISIONING_PROFILE_SPECIFIER = \"$PROFIL_ADI\"; CODE_SIGN_IDENTITY = \"iPhone Distribution\";|g" App.xcodeproj/project.pbxproj
          grep -c "PROVISIONING_PROFILE_SPECIFIER" App.xcodeproj/project.pbxproj

          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive

          cat > /tmp/ExportOptions.plist <<EOP
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>iPhone Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>com.ibrahimaktas.ravza</key><string>$PROFIL_ADI</string></dict>
          </dict></plist>
          EOP

          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath build/ipa

          ls -la build/ipa/

      - name: TestFlight'a yukle (imzali)
        if: github.event.inputs.mod == 'imzali'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/private_keys
          echo "$KEY" > ~/private_keys/AuthKey_$KEY_ID.p8
          chmod 600 ~/private_keys/AuthKey_$KEY_ID.p8
          IPA=$(ls ios/App/build/ipa/*.ipa | head -1)
          echo "Yuklenecek: $IPA"
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
          echo "TestFlight yuklemesi tamamlandi"

      - name: IPA'yi ciktiya ekle (imzali)
        if: github.event.inputs.mod == 'imzali'
        uses: actions/upload-artifact@v4
        with:
          name: ravza-ios-imzali
          path: ios/App/build/ipa/*.ipa
          retention-days: 30
