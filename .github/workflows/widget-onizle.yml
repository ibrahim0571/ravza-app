# Ravza iOS widget görsel önizleme (macOS SwiftUI ImageRenderer, mağazaya gitmez)
name: Widget Onizle
on:
  workflow_dispatch:
jobs:
  onizle:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Xcode sec
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
      - name: Ciz
        working-directory: ios/WidgetOnizle
        run: |
          # iOS'a özel API'ler macOS'ta yok: widget kodunu macOS için uyarlanmış kopyayla derle
          sed -e '/^@available(iOSApplicationExtension 17.0, \*)$/,/^}$/d' -e 's/Button(intent: KildimIntent(vakit: kod)) { ic }.buttonStyle(.plain)/ic/' -e 's/^import AppIntents//' -e 's/@main//' -e 's/@Environment(\\.widgetFamily) var aile/var aile: WidgetFamily = .systemMedium/' -e 's/iOSApplicationExtension 17.0/macOS 99.0/g' \
              -e 's/\.accessoryCircular, \.accessoryRectangular, \.accessoryInline//' \
              ../App/RavzaWidgets/RavzaWidgets.swift > widget.swift
          mkdir -p cikti
          for d in tr ar en; do
            mkdir -p d_$d
            sed "s/let DIL: String = {/let DIL: String = \"$d\"; let _X: String = {/" widget.swift > d_$d/widget.swift
            sed "s#cikti/#cikti/${d}_#" main.swift > d_$d/main.swift
            [ "$d" = ar ] && sed -i '' 's#let kap = v.frame#let kap = v.environment(\\.layoutDirection, .rightToLeft).frame#' d_$d/main.swift
            swiftc -O -target arm64-apple-macos14 d_$d/widget.swift d_$d/main.swift -o onizle_$d 2>&1 | grep -v warning: | head -40 || true
            RZ_ONIZLE=1 ./onizle_$d
          done
          ls cikti
      - uses: actions/upload-artifact@v4
        with:
          name: widget-onizle
          path: ios/WidgetOnizle/cikti/*.png
