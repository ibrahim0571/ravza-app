<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ravza</title>
<!-- 27 Eki 2026: server.errorPath. Ana site yüklenemezse (ağ yok, Cloudflare 5xx/530 tünel hatası) Capacitor bu YEREL sayfayı açar.
     Huawei 1.0.10 reddi (kural 3.1): incelemede Cloudflare hata sayfası görünmüştü. 11 dil, kendini yeniler, tasarım index.html ile aynı. -->
<style>
  :root{ --emerald:#0e6b58; --gold:#C9A227; --gold-light:#E3C55A; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Arabic","Noto Sans JP","Noto Sans SC",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    background:radial-gradient(circle at 50% 35%,#128a6f 0%,#0e6b58 45%,#073D27 100%);color:#fff}
  main{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center}
  .ay{font-size:64px;margin-bottom:18px;animation:yuz 4s ease-in-out infinite;filter:drop-shadow(0 8px 24px rgba(201,162,39,.45))}
  @keyframes yuz{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .brand{font-size:30px;font-weight:700;letter-spacing:5px;margin-bottom:22px;
    background:linear-gradient(90deg,#E3C55A,#F0E4B8,#C9A227);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  h1{font-size:20px;font-weight:600;line-height:1.35;max-width:320px}
  p{color:#bfe0cd;font-size:14.5px;margin-top:10px;line-height:1.55;max-width:300px}
  button{margin-top:28px;padding:14px 36px;border:none;border-radius:26px;font-size:16px;font-weight:600;color:#073D27;
    background:linear-gradient(90deg,#E3C55A,#C9A227);box-shadow:0 8px 24px rgba(201,162,39,.35);cursor:pointer;min-width:180px}
  button:active{transform:scale(.96)}
  .sayac{margin-top:16px;font-size:12.5px;color:#9fcbb6;min-height:18px}
  .bar{width:60px;height:3px;background:rgba(255,255,255,.15);border-radius:3px;margin-top:10px;overflow:hidden}
  .bar::after{content:'';display:block;width:40%;height:100%;background:var(--gold);border-radius:3px;animation:ld 1.5s ease-in-out infinite}
  @keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  [dir=rtl] h1,[dir=rtl] p{direction:rtl}
</style>
</head>
<body>
<main>
  <div class="ay" aria-hidden="true">🌙</div>
  <div class="brand">RAVZA</div>
  <h1 id="b"></h1>
  <p id="a"></p>
  <button id="d" type="button"></button>
  <div class="sayac" id="s" aria-live="polite"></div>
  <div class="bar" aria-hidden="true"></div>
</main>
<script>
  var HEDEF = "https://tesbihat.ibrahimaktas.com/dashboard";
  var M = {
    tr:{b:"Ravza'ya şu an ulaşılamıyor",a:"Bağlantını kontrol et. Birkaç saniye içinde kendiliğinden yeniden deneyeceğiz.",d:"Tekrar Dene",s:"{n} sn sonra yeniden denenecek"},
    en:{b:"Ravza can't be reached right now",a:"Please check your connection. We'll try again automatically in a few seconds.",d:"Try Again",s:"Retrying in {n} s"},
    ar:{b:"تعذّر الوصول إلى روضة الآن",a:"يرجى التحقق من اتصالك. سنعيد المحاولة تلقائيًا خلال ثوانٍ.",d:"أعد المحاولة",s:"إعادة المحاولة خلال {n} ث"},
    de:{b:"Ravza ist gerade nicht erreichbar",a:"Bitte prüfe deine Verbindung. Wir versuchen es in wenigen Sekunden automatisch erneut.",d:"Erneut versuchen",s:"Neuer Versuch in {n} s"},
    fr:{b:"Ravza est momentanément inaccessible",a:"Vérifiez votre connexion. Nous réessaierons automatiquement dans quelques secondes.",d:"Réessayer",s:"Nouvel essai dans {n} s"},
    it:{b:"Ravza non è raggiungibile al momento",a:"Controlla la connessione. Riproveremo automaticamente tra pochi secondi.",d:"Riprova",s:"Nuovo tentativo tra {n} s"},
    nl:{b:"Ravza is nu niet bereikbaar",a:"Controleer je verbinding. We proberen het over enkele seconden automatisch opnieuw.",d:"Opnieuw proberen",s:"Opnieuw over {n} s"},
    ru:{b:"Ravza сейчас недоступна",a:"Проверьте подключение. Мы автоматически повторим попытку через несколько секунд.",d:"Повторить",s:"Повтор через {n} с"},
    ku:{b:"Niha xwe nagihîne Ravza",a:"Ji kerema xwe girêdana xwe kontrol bike. Em ê di çend saniyeyan de bixweber dîsa biceribînin.",d:"Dîsa biceribîne",s:"Di {n} saniyeyan de dîsa"},
    ja:{b:"現在 Ravza に接続できません",a:"接続を確認してください。数秒後に自動で再試行します。",d:"再試行",s:"{n} 秒後に再試行"},
    zh:{b:"暂时无法连接 Ravza",a:"请检查网络连接，几秒后将自动重试。",d:"重试",s:"{n} 秒后重试"}
  };
  function dilSec(){
    var adaylar=[];
    try{ var k=localStorage.getItem("ravza_language")||localStorage.getItem("user_language"); if(k) adaylar.push(k); }catch(e){}
    (navigator.languages||[navigator.language||"tr"]).forEach(function(x){ adaylar.push(x); });
    for(var i=0;i<adaylar.length;i++){ var d=String(adaylar[i]||"").toLowerCase().split(/[-_]/)[0]; if(M[d]) return d; }
    return "en";
  }
  var dil=dilSec(), T=M[dil];
  document.documentElement.lang=dil; document.documentElement.dir=(dil==="ar")?"rtl":"ltr";
  document.getElementById("b").textContent=T.b; document.getElementById("a").textContent=T.a; document.getElementById("d").textContent=T.d;
  // Deneme sayısı: her başarısız dönüşte bekleme uzar (8 → 15 → 30 → 60 sn), sunucuyu boğmaz
  var n=0; try{ n=parseInt(sessionStorage.getItem("ravza_hata_say")||"0",10)||0; sessionStorage.setItem("ravza_hata_say",String(n+1)); }catch(e){}
  var bekle=[8,15,30,60][Math.min(n,3)], kalan=bekle, zaman=null;
  function git(){ clearInterval(zaman); document.getElementById("s").textContent=""; window.location.replace(HEDEF); }
  function say(){
    if(navigator.onLine===false){ document.getElementById("s").textContent=""; return; }
    document.getElementById("s").textContent=T.s.replace("{n}",kalan);
    if(--kalan<0) git();
  }
  document.getElementById("d").addEventListener("click",function(){ try{ sessionStorage.setItem("ravza_hata_say","0"); }catch(e){} git(); });
  window.addEventListener("online",function(){ kalan=2; });
  zaman=setInterval(say,1000); say();
</script>
</body>
</html>
